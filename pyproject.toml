[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "photovoltaic-xai"
version = "0.1.0"
description = "Multilabel classification for photovoltaic XAI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.2,<3",
    "pillow>=11,<13",
    "pandas>=2.2,<3",
    "scikit-learn>=1.6,<2",
    "scipy>=1.15,<2",
    "iterative-stratification>=0.1.9,<0.2",
    "ImageHash>=4.3,<5",
    "matplotlib>=3.10,<4",
    "torchinfo>=1.8,<2",
    "jupyterlab>=4.4,<5",
    "ipykernel>=6.29,<8",
]

[project.optional-dependencies]
cpu = ["torch==2.9.1+cpu", "torchvision==0.24.1+cpu"]
cuda = ["torch==2.9.1+cu128", "torchvision==0.24.1+cu128"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "nbformat>=5.10,<6", "ruff>=0.11,<1"]

[tool.uv]
conflicts = [[{extra = "cpu"}, {extra = "cuda"}]]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = [{index = "pytorch-cpu", extra = "cpu"}, {index = "pytorch-cu128", extra = "cuda"}]
torchvision = [{index = "pytorch-cpu", extra = "cpu"}, {index = "pytorch-cu128", extra = "cuda"}]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.hatch.build.targets.wheel]
packages = ["src/photovoltaic_xai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
